version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fluxguard-postgres
    restart: always
    environment:
      POSTGRES_DB: fluxguard_db
      POSTGRES_USER: fluxguard_user
      POSTGRES_PASSWORD: fluxguard_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxguard_user -d fluxguard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fluxguard-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: fluxguard_db
      DB_USER: fluxguard_user
      DB_PASSWORD: fluxguard_secret
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fluxguard-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
